services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: archivault
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python setup_local.py first}
      MYSQL_USER: archivault
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python setup_local.py first}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["dbdata:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build: .
    command: >-
      sh -c "python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ".:/app"
      - "media:/app/media"
      - "staticfiles:/app/staticfiles"
    ports: ["127.0.0.1:8000:8000"]
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  media:
  staticfiles:
